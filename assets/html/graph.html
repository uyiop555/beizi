<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { background-color: #121212; color: #ffffff; font-family: sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box;}
        .hint { font-size: 12px; color: #aaaaaa; line-height: 1.5; margin-bottom: 10px; background: #1e1e1e; padding: 10px; border-radius: 8px;}
        textarea { width: 100%; box-sizing: border-box; background: #1e1e1e; color: #fff; border: none; border-radius: 8px; padding: 10px; font-family: monospace; resize: none; outline: none; margin-bottom: 10px; height: 80px;}
        button { width: 100%; background: #ff6b00; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; margin-bottom: 10px;}
        #canvas-container { flex: 1; background: #1e1e1e; border-radius: 8px; overflow: hidden; position: relative;}
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
<div class="hint">
    ^代表乘方，/表示除，*表示乘(不可省略)<br>
    不等号分别为 &lt; , &lt;= , &gt; , &gt;= (支持 0&lt;x&lt;=3 写法)<br>
    "sqrt(数字)" 表示平方，"abs(数字)" 表示绝对值<br>
    所有括号,冒号用英文 (多函数请换行输入)
</div>
<textarea id="input" placeholder="单个函数直接输入（省略f(x)）&#10;分段函数格式：“范围:函数”"></textarea>
<button onclick="draw()">绘制图像</button>
<div id="canvas-container">
    <canvas id="canvas"></canvas>
</div>
    <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');
    
    let scale = 30;
    let offsetX = 0;
    let offsetY = 0;

    function resize() {
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        offsetX = canvas.width / 2;
        offsetY = canvas.height / 2;
        draw();
    }

    function getY(exprData, x) {
        if (!exprData) return null;
        try {
            let condCode = exprData.cond.replace(/\^/g, '**');
            condCode = condCode.replace(/([a-zA-Z0-9.-]+)\s*(<=|<|>=|>)\s*x\s*(<=|<|>=|>)\s*([a-zA-Z0-9.-]+)/g, "$1 $2 x && x $3 $4");
            condCode = condCode.replace(/x/g, `(${x})`);
            
            if (new Function(`return ${condCode};`)()) {
                let e = exprData.formula.replace(/\^/g, '**').replace(/sin/g, 'Math.sin').replace(/cos/g, 'Math.cos').replace(/tan/g, 'Math.tan').replace(/sqrt/g, 'Math.sqrt').replace(/abs/g, 'Math.abs').replace(/log/g, 'Math.log').replace(/pi/g, 'Math.PI');
                let y = new Function('x', `return ${e};`)(x);
                return isFinite(y) ? y : null;
            }
        } catch(e) {}
        return null;
    }

    function draw() {
        ctx.fillStyle = '#1e1e1e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const inputStr = document.getElementById('input').value.trim();
        const lines = inputStr ? inputStr.split('\n') : [];
        
        ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
        for(let i = -100; i <= 100; i++) {
            let px = offsetX + i * scale;
            if(px > 0 && px < canvas.width) { ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, canvas.height); ctx.stroke(); }
            let py = offsetY + i * scale;
            if(py > 0 && py < canvas.height) { ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(canvas.width, py); ctx.stroke(); }
        }

        const funcs = [];
        for(let i = 0; i < lines.length; i++) {
            let expr = lines[i].trim();
            if(!expr) continue;
            let isSeg = expr.includes(':');
            funcs.push({
                cond: isSeg ? expr.split(':')[0].trim() : "true",
                formula: isSeg ? expr.split(':')[1].trim() : expr,
                color: ['#ff6b00', '#00cc66', '#3b6ef6', '#e03131'][i % 4]
            });
        }            for(let f of funcs) {
                ctx.strokeStyle = f.color; ctx.lineWidth = 3; ctx.beginPath();
                let isDrawing = false;
                for(let px = 0; px < canvas.width; px++) {
                    let x = (px - offsetX) / scale;
                    let y = getY(f, x);
                    if(y !== null) {
                        let py = offsetY - y * scale;
                        if(py > -1000 && py < 1000) {
                            if(!isDrawing) { ctx.moveTo(px, py); isDrawing = true; }
                            else { ctx.lineTo(px, py); }
                            continue;
                        }
                    }
                    isDrawing = false;
                }
                ctx.stroke();
            }

            ctx.strokeStyle = '#888'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, offsetY); ctx.lineTo(canvas.width, offsetY); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(offsetX, 0); ctx.lineTo(offsetX, canvas.height); ctx.stroke();

            ctx.fillStyle = '#aaaaaa'; ctx.font = '12px sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'top';
            let step = scale < 20 ? 5 : (scale < 40 ? 2 : 1);
            for(let i = -100; i <= 100; i += step) {
                if(i === 0) continue;
                let px = offsetX + i * scale;
                if(px > 20 && px < canvas.width - 20) ctx.fillText(i, px, Math.min(canvas.height - 20, Math.max(5, offsetY + 5)));
            }

            ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
            for(let i = -100; i <= 100; i += step) {
                if(i === 0) continue;
                let py = offsetY - i * scale;
                if(py > 15 && py < canvas.height - 15) ctx.fillText(i, Math.max(20, Math.min(canvas.width - 5, offsetX - 5)), py);
            }
            ctx.fillText("0", Math.max(15, Math.min(canvas.width - 5, offsetX - 5)), Math.min(canvas.height - 15, Math.max(15, offsetY + 10)));
        }

        let isDragging = false, lastX, lastY, initialDist = 0;

        canvas.addEventListener('touchstart', e => {
            if(e.touches.length === 1) { isDragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; } 
            else if(e.touches.length === 2) { isDragging = false; initialDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }
        }, {passive: false});

        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            if(isDragging && e.touches.length === 1) {
                let dx = e.touches[0].clientX - lastX, dy = e.touches[0].clientY - lastY;
                offsetX += dx; offsetY += dy; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; draw();
            } else if(e.touches.length === 2) {
                let dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                if(initialDist > 0) { let factor = dist / initialDist; scale *= factor; initialDist = dist; draw(); }
            }
        }, {passive: false});

        canvas.addEventListener('touchend', () => { isDragging = false; initialDist = 0; });

        let isMouseDown = false;
        canvas.addEventListener('mousedown', e => { isMouseDown = true; lastX = e.clientX; lastY = e.clientY; });
        canvas.addEventListener('mousemove', e => {
            if(isMouseDown) { offsetX += e.clientX - lastX; offsetY += e.clientY - lastY; lastX = e.clientX; lastY = e.clientY; draw(); }
        });
        canvas.addEventListener('mouseup', () => isMouseDown = false);
        canvas.addEventListener('wheel', e => { e.preventDefault(); scale *= (e.deltaY > 0 ? 0.9 : 1.1); draw(); }, {passive: false});

        window.onload = resize;
        window.addEventListener('resize', resize);
    </script>
</body>
