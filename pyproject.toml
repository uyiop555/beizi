[project]
name = "beizi"
version = "1.8.0"
description = "乐迪计算器"
requires-python = ">=3.9"
dependencies = [
    "flet",
    "flet-webview-all",
    "openai",
    "google-genai",
    "httpx",
]

[tool.flet]
product_name = "乐迪计算器"
cleartext_traffic = true
assets = ["assets"]

[tool.flet.android]
extract_packages = ["openai"]